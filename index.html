<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neumann Training</title>

    <!-- Connect HTML to CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font required by the PDF: Mulish -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- This appears first when the page loads -->
    <div id="loader">
        <h1 class="logo">implify</h1>
        <p>Making Information Simple, Tangible and Beautiful.</p>
        <span>Loading... please wait</span>
    </div>

    <div id="login-page" class="hidden">
        <div class="login-box">
           <h1>Login</h1>

           <form id="login-form">
               <input type="text" id="login-username" placeholder="Username">
               <input type="password" id="login-password" placeholder="Password">
               <label class="remember-me">
                 <input type="checkbox" id="remember-me">
                 Remember me
                </label>
               <button type="submit">Login</button>
            </form>
            <p id="login-error"></p>
        </div>
    </div>

    <!-- This is the real app, hidden at first -->
    <div id="app" class="hidden">

        <!-- Top header -->
        <header>
            <div class="top-color-line"></div>

            <div class="header-content">
                <h1 class="logo">implify</h1>

                <nav class="nav-menu">
                    <a href="#">About Us</a>
                    <a href="#">Our Products</a>
                    <a href="#">Our Services</a>
                    <a href="#">Contact Us</a>
                </nav>

                <div class="header-actions">
                <button id="theme-toggle-btn" class="theme-toggle-btn">Dark Mode</button>
                <button id="add-user-btn" class="add-user-btn"> Add User </button>
                <button id="logout-btn" class="logout-btn">Logout</button>
                </div>

                <button id="menu-btn" class="menu-btn">☰</button>

            </div>
        </header>

        <!-- Main page content -->
        <main>
             <div class="filter-area">
          <h3 style="color: #5459e2">  Filter Company </h3>

           <label>
           <input type="checkbox" class="company-filter" value="Benton">Benton</label>
           <label>
           <input type="checkbox" class="company-filter" value="Chanay">Chanay</label>
           <label>
           <input type="checkbox" class="company-filter" value="Chemel">Chemel</label>
           <label>
           <input type="checkbox" class="company-filter" value="Feltz Printing">Feltz Printing</label>
           <label>
           <input type="checkbox" class="company-filter" value="Commercial Press">Commercial Press</label>

             </div>

            <!-- JavaScript will put the employee cards here -->
           <div class="users-area">
        
            <section id="users-list" class="users-list"></section>

            <div>

            <button id="show-more-btn" class="show-more-btn">Show More   </button>
              
            </div>
            </div>

            <!-- Details panel opens here when we click a user -->
            <section id="details-panel" class="details-panel">
                <button id="close-details" class="close-bt">x</button>
                <div id="details-content"></div>
            </section>

        </main>
    </div>


<div class="modal fade" id="message-modal" tabindex="-1" role="dialog" aria-labelledby="message-modal-title" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header bg-primary text-white" id="message-modal-header">
                <h5 class="modal-title" id="message-modal-title">Message</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body" id="message-modal-body">
                Message text
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
            </div>

        </div>
    </div>
</div>


<div class="modal fade" id="delete-modal" tabindex="-1" role="dialog" aria-labelledby="delete-modal-title" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="delete-modal-title">Confirm Delete</h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                Are you sure you want to delete this user?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
            </div>

        </div>
    </div>
</div>



    <!-- Connect HTML to JavaScript -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
